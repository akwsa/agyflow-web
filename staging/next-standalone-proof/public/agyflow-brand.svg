<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AGYFLOW brand banner</title>
  <desc id="desc">Modern SaaS brand banner for agyflow.com</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="1" stop-color="#102c4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35e0b2"/>
      <stop offset="1" stop-color="#56b9ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#background)"/>
  <circle cx="1330" cy="80" r="220" fill="#1a78a8" opacity=".13"/>
  <circle cx="150" cy="820" r="300" fill="#16b995" opacity=".08"/>
  <path d="M1040 190C1240 80 1410 210 1580 120M1040 300C1220 210 1400 350 1600 250M1040 410C1220 330 1400 470 1600 370" fill="none" stroke="#73d8ff" stroke-opacity=".12" stroke-width="3"/>
  <g transform="translate(150 245)">
    <circle cx="130" cy="130" r="118" fill="#0d2846" stroke="url(#accent)" stroke-width="8" filter="url(#glow)"/>
    <path d="M82 178V82h38l40 55 40-55h38v96h-35v-49l-43 56-43-56v49z" fill="url(#accent)"/>
    <circle cx="244" cy="82" r="13" fill="#35e0b2"/>
  </g>
  <text x="430" y="410" fill="#f5fbff" font-family="Arial, Helvetica, sans-serif" font-size="126" font-weight="700" letter-spacing="8">AGYFLOW</text>
  <text x="440" y="500" fill="#9cc4d8" font-family="Arial, Helvetica, sans-serif" font-size="42" letter-spacing="9">SMART WORKFLOWS FOR SMALL TEAMS</text>
  <rect x="442" y="575" width="490" height="3" rx="2" fill="url(#accent)"/>
  <text x="440" y="650" fill="#d5edf5" font-family="Arial, Helvetica, sans-serif" font-size="38" letter-spacing="3">agyflow.com</text>
  <text x="440" y="710" fill="#81a9bd" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="2">Compliance · Support · Operations</text>
</svg>
